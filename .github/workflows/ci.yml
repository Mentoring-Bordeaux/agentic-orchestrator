name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22.x'

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET) - Build, Test & Push Image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore AgenticOrchestrator.slnx

      - name: Build
        run: dotnet build AgenticOrchestrator.slnx --configuration Release --no-restore

      - name: Test (Pull Requests only)
        if: github.event_name == 'pull_request'
        run: dotnet test AgenticOrchestrator.slnx --configuration Release --no-build --verbosity normal

      - name: Azure Login with OIDC
        if: github.event_name == 'workflow_dispatch'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and Push Backend Image to ACR
        if: github.event_name == 'workflow_dispatch'
        run: |
          az acr login --name ${{ vars.AZURE_ACR_NAME }}
          docker build \
            -t ${{ vars.AZURE_ACR_NAME }}.azurecr.io/backend:${{ github.run_id }} \
            -t ${{ vars.AZURE_ACR_NAME }}.azurecr.io/backend:latest .
          docker push ${{ vars.AZURE_ACR_NAME }}.azurecr.io/backend:${{ github.run_id }}
          docker push ${{ vars.AZURE_ACR_NAME }}.azurecr.io/backend:latest

  frontend:
    name: Frontend (Nuxt) - Build & Push Image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Azure Login with OIDC
        if: github.event_name == 'workflow_dispatch'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and Push Frontend Image to ACR
        if: github.event_name == 'workflow_dispatch'
        run: |
          az acr login --name ${{ vars.AZURE_ACR_NAME }}
          docker build \
            -t ${{ vars.AZURE_ACR_NAME }}.azurecr.io/frontend:${{ github.run_id }} \
            -t ${{ vars.AZURE_ACR_NAME }}.azurecr.io/frontend:latest .
          docker push ${{ vars.AZURE_ACR_NAME }}.azurecr.io/frontend:${{ github.run_id }}
          docker push ${{ vars.AZURE_ACR_NAME }}.azurecr.io/frontend:latest