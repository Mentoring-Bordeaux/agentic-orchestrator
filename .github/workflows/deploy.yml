name: Continuous Deployment (Azure)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  #used by GitHub Actions for OIDC authentication


jobs:
  deploy:
    name: Build and Deploy via Pulumi
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:                                                   #add to Github secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Node.js (Frontend Nuxt)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup .NET (Backend ASP.NET Core)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.112'

      - name: Pulumi Up (Infrastructure and App)  # after ticket : initializing Infrastructure 
        uses: pulumi/actions@v5
        with:
          command: up
          stack-name: dev 
          work-dir: ./infrastructure  
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}    #add Pulumi access token after creating a Pulumi account and generating a token
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}